<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">IIA Cloud product framework</title><desc id="desc">A product and service architecture showing user workspaces, message routing, agent orchestration, sandbox execution, and platform services.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#eef4ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#152238" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7c8da6"/></marker></defs><rect width="1400" height="780" fill="url(#bg)"/><text x="70" y="72" fill="#172033" font-family="Arial,sans-serif" font-size="30" font-weight="700">IIA Cloud · product framework</text><text x="70" y="108" fill="#718096" font-family="Arial,sans-serif" font-size="17">From user intent to governed, observable AI-assisted delivery</text><g font-family="Arial,sans-serif"><rect x="70" y="160" width="270" height="150" rx="20" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="100" y="205" fill="#2563eb" font-size="15" font-weight="700">EXPERIENCE LAYER</text><text x="100" y="245" fill="#172033" font-size="23" font-weight="700">User workspace</text><text x="100" y="277" fill="#718096" font-size="16">Issue · Structure · Team</text><rect x="70" y="380" width="270" height="150" rx="20" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="100" y="425" fill="#2563eb" font-size="15" font-weight="700">CONTROL LAYER</text><text x="100" y="465" fill="#172033" font-size="23" font-weight="700">Message server</text><text x="100" y="497" fill="#718096" font-size="16">Routing · events · WebSocket</text><rect x="500" y="265" width="330" height="180" rx="24" fill="#2563eb" filter="url(#shadow)"/><text x="545" y="315" fill="#bfdbfe" font-size="15" font-weight="700">ORCHESTRATION</text><text x="545" y="360" fill="#fff" font-size="28" font-weight="700">iia.agent</text><text x="545" y="395" fill="#dbeafe" font-size="16">Run allocation · MCP · HITL</text><rect x="1000" y="160" width="300" height="150" rx="20" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="1030" y="205" fill="#7c3aed" font-size="15" font-weight="700">EXECUTION LAYER</text><text x="1030" y="245" fill="#172033" font-size="23" font-weight="700">Sandbox + CLI</text><text x="1030" y="277" fill="#718096" font-size="16">Isolated tools · reasoning</text><rect x="1000" y="380" width="300" height="150" rx="20" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/><text x="1030" y="425" fill="#059669" font-size="15" font-weight="700">PLATFORM LAYER</text><text x="1030" y="465" fill="#172033" font-size="23" font-weight="700">Core services</text><text x="1030" y="497" fill="#718096" font-size="16">IAM · objects · Git · docs</text><path d="M340 235 H500" stroke="#7c8da6" stroke-width="3" marker-end="url(#arrow)"/><path d="M340 455 H500" stroke="#7c8da6" stroke-width="3" marker-end="url(#arrow)"/><path d="M830 320 H1000" stroke="#7c8da6" stroke-width="3" marker-end="url(#arrow)"/><path d="M830 390 H1000" stroke="#7c8da6" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 445 V625 H1150 V530" fill="none" stroke="#7c8da6" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="70" y="680" fill="#718096" font-size="16">Product lens: clear boundaries, explicit ownership, observable hand-offs, and human control at the right checkpoints.</text></g></svg>