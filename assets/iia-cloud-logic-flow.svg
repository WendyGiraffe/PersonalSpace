<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">IIA Cloud product logic flow</title><desc id="desc">A product logic flow from conversation and issue creation through analysis, implementation, verification, acceptance, and knowledge sedimentation.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fffaf5"/><stop offset="1" stop-color="#fff"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="#d4783c"/></marker></defs><rect width="1400" height="780" fill="url(#bg)"/><text x="70" y="72" fill="#24180f" font-family="Arial,sans-serif" font-size="30" font-weight="700">IIA Cloud · delivery logic</text><text x="70" y="108" fill="#8a6b57" font-family="Arial,sans-serif" font-size="17">A shared product loop replacing fragmented hand-offs</text><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#e8d7ca" stroke-width="2"><rect x="70" y="185" width="220" height="104" rx="18"/><rect x="360" y="185" width="220" height="104" rx="18"/><rect x="650" y="185" width="220" height="104" rx="18"/><rect x="940" y="185" width="220" height="104" rx="18"/><rect x="1130" y="430" width="220" height="104" rx="18"/><rect x="840" y="610" width="220" height="104" rx="18"/><rect x="520" y="610" width="220" height="104" rx="18"/><rect x="200" y="430" width="220" height="104" rx="18"/></g><g fill="#d4783c" font-size="14" font-weight="700"><text x="100" y="220">01 · SIGNAL</text><text x="390" y="220">02 · STRUCTURE</text><text x="680" y="220">03 · ANALYZE</text><text x="970" y="220">04 · DESIGN</text><text x="1160" y="465">05 · BUILD</text><text x="870" y="645">06 · VERIFY</text><text x="550" y="645">07 · ACCEPT</text><text x="230" y="465">08 · LEARN</text></g><g fill="#24180f" font-size="21" font-weight="700"><text x="100" y="255">Team conversation</text><text x="390" y="255">AI-created issue</text><text x="680" y="255">Requirement analysis</text><text x="970" y="255">Solution design</text><text x="1160" y="500">Development</text><text x="870" y="680">Testing &amp; review</text><text x="550" y="680">Release decision</text><text x="230" y="500">Knowledge base</text></g><g stroke="#d4783c" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M290 237 H360"/><path d="M580 237 H650"/><path d="M870 237 H940"/><path d="M1160 289 V430"/><path d="M1240 534 C1240 590 1060 595 990 610"/><path d="M840 662 H740"/><path d="M520 662 H420"/><path d="M200 482 C110 430 110 290 180 289"/></g><path d="M1060 288 C1130 335 1180 350 1240 430" fill="none" stroke="#9cc5b5" stroke-width="3" stroke-dasharray="9 8"/><text x="1070" y="345" fill="#397b68" font-size="14">automation / agent assistance</text><text x="70" y="752" fill="#8a6b57" font-size="16">Product lens: every step has an owner, a state transition, a review point, and a reusable output.</text></g></svg>