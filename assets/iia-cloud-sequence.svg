<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">IIA Cloud agent sequence diagram</title><desc id="desc">A sequence diagram showing user message, message server, agent orchestration, sandbox, core services, and real-time result delivery.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="#50627b"/></marker></defs><rect width="1400" height="820" fill="#f7fafc"/><text x="70" y="65" fill="#172033" font-family="Arial,sans-serif" font-size="30" font-weight="700">IIA Cloud · agent run sequence</text><text x="70" y="100" fill="#718096" font-family="Arial,sans-serif" font-size="17">A product-level view of routing, execution, tool calls, and feedback</text><g font-family="Arial,sans-serif" font-size="16" fill="#172033"><g font-weight="700"><rect x="65" y="145" width="150" height="54" rx="12" fill="#dbeafe"/><text x="105" y="179">User</text><rect x="280" y="145" width="190" height="54" rx="12" fill="#e0f2fe"/><text x="313" y="179">Message server</text><rect x="535" y="145" width="180" height="54" rx="12" fill="#dbeafe"/><text x="575" y="179">iia.agent</text><rect x="780" y="145" width="190" height="54" rx="12" fill="#ede9fe"/><text x="811" y="179">Sandbox + CLI</text><rect x="1035" y="145" width="190" height="54" rx="12" fill="#dcfce7"/><text x="1072" y="179">Core services</text></g><g stroke="#b6c2d2" stroke-width="2" stroke-dasharray="8 8"><path d="M140 199 V730"/><path d="M375 199 V730"/><path d="M625 199 V730"/><path d="M875 199 V730"/><path d="M1130 199 V730"/></g><g stroke="#50627b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M140 250 H375"/><path d="M375 315 H625"/><path d="M625 380 H875"/><path d="M875 445 H1130"/><path d="M1130 510 H625"/><path d="M625 575 H375"/><path d="M375 640 H140"/></g><g font-size="15"><rect x="170" y="225" width="190" height="46" rx="10" fill="#fff" stroke="#d8e0ea"/><text x="185" y="253">① chat message / WS</text><rect x="410" y="290" width="195" height="46" rx="10" fill="#fff" stroke="#d8e0ea"/><text x="425" y="318">② POST /runs</text><rect x="670" y="355" width="175" height="46" rx="10" fill="#fff" stroke="#d8e0ea"/><text x="686" y="383">③ allocate sandbox</text><rect x="925" y="420" width="190" height="46" rx="10" fill="#fff" stroke="#d8e0ea"/><text x="941" y="448">④ MCP tools / call</text><rect x="720" y="485" width="250" height="46" rx="10" fill="#fff" stroke="#d8e0ea"/><text x="737" y="513">⑤ execute business operation</text><rect x="400" y="550" width="195" height="46" rx="10" fill="#fff" stroke="#d8e0ea"/><text x="416" y="578">⑥ progress / result</text><rect x="165" y="615" width="205" height="46" rx="10" fill="#fff" stroke="#d8e0ea"/><text x="180" y="643">⑦ real-time feedback</text></g></g><text x="70" y="770" fill="#718096" font-family="Arial,sans-serif" font-size="16">Product lens: the sequence makes latency, ownership, failure recovery, and human intervention explicit before implementation.</text></svg>